        function showError(show) {
            const errorMsg = document.getElementById('error-msg');
            if (show) {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.remove('opacity-0'), 10);
            } else {
                errorMsg.classList.add('opacity-0');
                setTimeout(() => errorMsg.classList.add('hidden'), 300);
            }
        }

        function decodeBlueprint() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;
            const val3 = document.getElementById('num3').value;

            if (val1 === '' || val2 === '' || val3 === '') {
                showError(true);
                return;
            }

            const num1 = parseInt(val1, 10);
            const num2 = parseInt(val2, 10);
            const num3 = parseInt(val3, 10);

            if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
                showError(true);
                return;
            }
            showError(false);

            const lowerIndex = num1 % 8;
            const upperIndex = num2 % 8;
            const lineIndex = num3 % 6;

            const lowerTrigram = trigrams[lowerIndex];
            const upperTrigram = trigrams[upperIndex];
            
            const hexagramLines = [...lowerTrigram.lines, ...upperTrigram.lines];
            
            const arrayIndex = (lineIndex === 0) ? 5 : (lineIndex - 1);
            const isYang = hexagramLines[arrayIndex] === 1;

            let lineName = "";
            if (arrayIndex === 0) lineName = isYang ? "初九" : "初六";
            else if (arrayIndex === 1) lineName = isYang ? "九二" : "六二";
            else if (arrayIndex === 2) lineName = isYang ? "九三" : "六三";
            else if (arrayIndex === 3) lineName = isYang ? "九四" : "六四";
            else if (arrayIndex === 4) lineName = isYang ? "九五" : "六五";
            else if (arrayIndex === 5) lineName = isYang ? "上九" : "上六";

            const hexKey = `${upperIndex}_${lowerIndex}`;
            const hexagramInfo = hexagramData[hexKey] || { name: "未知卦象", desc: "此卦象體驗文字尚在建構中，請靜心等待宇宙更新..." };

            // 1. 對接外部資料庫 384 爻
            const actualLineNum = (lineIndex === 0) ? 6 : lineIndex; 
            let yaoScript = yaoStageData[lineIndex];

            if (typeof YAO_DATABASE !== 'undefined' && YAO_DATABASE[hexagramInfo.name] && YAO_DATABASE[hexagramInfo.name][actualLineNum]) {
                const yaoData = YAO_DATABASE[hexagramInfo.name][actualLineNum];
                yaoScript = `【${yaoData.theme}】\n\n${yaoData.text}`;
            }

            // 2. 取得對應的頂層思維量級與使命反照資料
            const levelInfo = levelMissionData[lineIndex];
            
            // 動態生成專屬蘇格拉底式靈魂叩問
            const dynamicQuestion = `「在這場『${hexagramInfo.name}』的生命體驗道場中，當你覺察並放下『${levelInfo.obsession}』、完成這次思維量級的躍遷後——你最想用這份淬鍊出來的智慧，去成全誰？去為這個世界帶來什麼樣的改變？」`;

            // 更新畫面 DOM
            document.getElementById('hexagram-symbol-upper').innerText = upperTrigram.symbol;
            document.getElementById('hexagram-symbol-lower').innerText = lowerTrigram.symbol;
            document.getElementById('upper-name').innerText = upperTrigram.nature;
            document.getElementById('lower-name').innerText = lowerTrigram.nature;
            
            document.getElementById('hexagram-name').innerText = hexagramInfo.name;
            document.getElementById('line-name').innerText = lineName;
            document.getElementById('interpretation-text').innerText = hexagramInfo.desc;
            document.getElementById('yao-interpretation-text').innerText = yaoScript;

            // 更新量級與使命區塊
            document.getElementById('level-title').innerText = levelInfo.title;
            document.getElementById('level-subtitle').innerText = levelInfo.subtitle;
            document.getElementById('level-inertia').innerText = levelInfo.inertia;
            document.getElementById('level-breakthrough').innerText = levelInfo.breakthrough;
            document.getElementById('level-mission').innerText = levelInfo.mission;
            document.getElementById('soul-question').innerText = dynamicQuestion;

            // 顯示結果區塊與動畫
            const resultSection = document.getElementById('result-section');
            resultSection.classList.remove('hidden');
            
            resultSection.classList.remove('fade-in-up');
            void resultSection.offsetWidth; 
            resultSection.classList.add('fade-in-up');

            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }
    </script>
</body>
</html>
